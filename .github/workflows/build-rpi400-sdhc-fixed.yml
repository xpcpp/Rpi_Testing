name: Build fixed Arasan SDHC ARM64 candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-rpi400-sdhc-fixed.yml"

permissions:
  contents: read

jobs:
  build-sdhc-arm64:
    name: Build bcm2836sdhc (ARM64, unsigned candidate)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    env:
      UPSTREAM_REPO: https://github.com/raspberrypi/windows-drivers.git
      UPSTREAM_COMMIT: 31c2c748e6358711cd72467b7ad52da08691e54b

    steps:
      - name: Check out project notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $found = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe'
          $msbuild = $found | Select-Object -First 1
          if (-not $msbuild -or -not (Test-Path $msbuild)) { throw "MSBuild.exe not found through vswhere." }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $msbuild -version -nologo

      - name: Fetch pinned upstream source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstream = Join-Path $env:RUNNER_TEMP 'windows-drivers'
          git clone --no-checkout $env:UPSTREAM_REPO $upstream
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          git -C $upstream fetch --depth 1 origin $env:UPSTREAM_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "fetch of pinned commit failed" }
          git -C $upstream checkout --detach $env:UPSTREAM_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "checkout of pinned commit failed" }
          $actual = (git -C $upstream rev-parse HEAD).Trim()
          if ($actual -ne $env:UPSTREAM_COMMIT) { throw "Source pin mismatch: expected $env:UPSTREAM_COMMIT, got $actual" }
          "UPSTREAM_DIR=$upstream" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Pinned upstream commit: $actual"
          git -C $upstream log -1 --format="%H%n%cs%n%s"

      - name: Patch INF for Pi 400 ID and modern Universal INF validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inf = Join-Path $env:UPSTREAM_DIR 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.inf'
          $text = Get-Content -LiteralPath $inf -Raw

          # BasicDriverOk is a legacy ControlFlags directive that the Universal INF
          # validator rejects (ERROR 1208). It affects legacy device-selection behavior,
          # not the SDHC miniport's runtime; current Microsoft driver samples removed it.
          if ($text -notmatch '(?im)^\[ControlFlags\]\s*$') {
            throw 'Pinned INF has no [ControlFlags] section; refusing a blind edit.'
          }
          if ($text -match '(?im)^[ \t]*BasicDriverOk[ \t]*=') {
            $text = [regex]::Replace($text, '(?im)^[ \t]*BasicDriverOk[ \t]*=[^\r\n]*(?:\r?\n|$)', '')
            Write-Host 'Removed legacy BasicDriverOk directive (Universal INF ERROR 1208).'
          }

          $old = '%ACPI\ARASAN.DeviceDesc%=SDHost, ACPI\ARASAN'
          $new = '%ACPI\ARASAN.DeviceDesc%=SDHost, ACPI\BCM2847, ACPI\ARASAN'
          if ($text -match '(?im)^%ACPI\\ARASAN\.DeviceDesc%=SDHost,\s*ACPI\\BCM2847,\s*ACPI\\ARASAN\s*$') {
            Write-Host 'INF already contains ACPI\BCM2847 hardware match.'
          } elseif ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            Write-Host 'Added explicit ACPI\BCM2847 match to the pinned Arasan INF.'
          } else {
            throw 'Unexpected pinned INF model line; refusing to silently patch the wrong source.'
          }

          if ($text -match '(?im)^[ \t]*BasicDriverOk[ \t]*=') {
            throw 'BasicDriverOk removal failed; refusing to continue.'
          }
          if ($text -notmatch '(?im)^%ACPI\\ARASAN\.DeviceDesc%=SDHost,\s*ACPI\\BCM2847,\s*ACPI\\ARASAN\s*$') {
            throw 'Required ACPI\BCM2847 model entry missing after patch.'
          }
          [System.IO.File]::WriteAllText($inf, $text, [System.Text.UTF8Encoding]::new($false))
          Select-String -LiteralPath $inf -Pattern 'ACPI\\BCM2847'
          $artifact = Join-Path $env:GITHUB_WORKSPACE '_sdhc_ci_artifact'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          @(
            'Pinned upstream INF was patched for Windows 11 Universal INF validation.'
            'Removed [ControlFlags] BasicDriverOk=* because InfVerif rejects it with ERROR(1208).'
            'Added ACPI\BCM2847 before the existing generic ACPI\ARASAN model ID for the Pi 400 SDC1.'
            'This is a compatibility patch to the pinned upstream INF; see the exact INF in this artifact.'
          ) | Set-Content -LiteralPath (Join-Path $artifact 'INF-HARDWARE-ID-PATCH.txt') -Encoding UTF8

      - name: Configure and restore WDK ARM64 NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @'
          <?xml version="1.0" encoding="utf-8"?>
          <packages>
            <package id="Microsoft.Windows.SDK.CPP" version="10.0.28000.2526" targetFramework="native" />
            <package id="Microsoft.Windows.SDK.CPP.x64" version="10.0.28000.2526" targetFramework="native" />
            <package id="Microsoft.Windows.SDK.CPP.arm64" version="10.0.28000.2526" targetFramework="native" />
            <package id="Microsoft.Windows.WDK.x64" version="10.0.28000.2526" targetFramework="native" />
            <package id="Microsoft.Windows.WDK.arm64" version="10.0.28000.2526" targetFramework="native" />
          </packages>
          '@
          $props = @'
          <Project>
            <Import Project="packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props" Condition="Exists('packages\Microsoft.Windows.WDK.x64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.x64.props') and '$(Platform)' == 'x64'"/>
            <Import Project="packages\Microsoft.Windows.WDK.arm64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.arm64.props" Condition="Exists('packages\Microsoft.Windows.WDK.arm64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.arm64.props') and '$(Platform)' == 'ARM64'"/>
            <Import Project="packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props" Condition="Exists('packages\Microsoft.Windows.SDK.CPP.x64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.x64.props') and '$(Platform)' == 'x64'"/>
            <Import Project="packages\Microsoft.Windows.SDK.CPP.arm64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.arm64.props" Condition="Exists('packages\Microsoft.Windows.SDK.CPP.arm64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.arm64.props') and '$(Platform)' == 'ARM64'"/>
            <Import Project="packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props" Condition="Exists('packages\Microsoft.Windows.SDK.CPP.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.props')"/>
          </Project>
          '@
          Set-Content -LiteralPath (Join-Path $env:UPSTREAM_DIR 'packages.config') -Value $packages -Encoding utf8
          Set-Content -LiteralPath (Join-Path $env:UPSTREAM_DIR 'Directory.Build.props') -Value $props -Encoding utf8
          nuget restore (Join-Path $env:UPSTREAM_DIR 'packages.config') -PackagesDirectory (Join-Path $env:UPSTREAM_DIR 'packages')
          if ($LASTEXITCODE -ne 0) { throw "NuGet WDK/SDK restore failed with exit code $LASTEXITCODE" }
          $required = @(
            'Microsoft.Windows.WDK.arm64.10.0.28000.2526\build\native\Microsoft.Windows.WDK.arm64.props',
            'Microsoft.Windows.SDK.CPP.arm64.10.0.28000.2526\build\native\Microsoft.Windows.SDK.cpp.arm64.props'
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path (Join-Path $env:UPSTREAM_DIR 'packages') $path))) {
              throw "Expected WDK/SDK props not found after restore: $path"
            }
          }

      - name: Expose WDK host tools on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(
            (Join-Path $env:UPSTREAM_DIR 'packages'),
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin')
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $wanted = @('stampinf.exe', 'tracewpp.exe', 'inf2cat.exe', 'signtool.exe', 'infverif.exe', 'apivalidator.exe', 'wpp.exe')
          $found = Get-ChildItem -Path $roots -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $wanted -contains $_.Name.ToLowerInvariant() }
          $stampinf = $found | Where-Object { $_.Name -ieq 'stampinf.exe' } | Select-Object -First 1
          if (-not $stampinf) {
            throw "stampinf.exe not found under WDK NuGet packages or Windows Kits bin. Roots searched: $($roots -join '; ')"
          }
          $dirs = $found.DirectoryName | Sort-Object -Unique
          foreach ($dir in $dirs) {
            $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
          "StampInf: $($stampinf.FullName)"
          "Added tool directories to PATH:"
          $dirs | ForEach-Object { Write-Host "  $_" }
          "Found WDK tools: $(($found.Name | Sort-Object -Unique) -join ', ')"

      - name: Repair WDK NuGet host-validator paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $env:UPSTREAM_DIR 'packages'
          $arm64 = Join-Path $packages 'Microsoft.Windows.WDK.arm64.10.0.28000.2526\c'
          $x64 = Join-Path $packages 'Microsoft.Windows.WDK.x64.10.0.28000.2526\c'

          # The ARM64 NuGet targets on this x64 runner point at an x86 ApiValidator path
          # even when the ARM64 WDK package omits that host executable. Supply the matching
          # version's x64 host tool set at the exact path referenced by those targets.
          $expectedToolDir = Join-Path $arm64 'bin\10.0.28000.0\x86'
          $sourceToolDir = Join-Path $x64 'bin\10.0.28000.0\x64'
          if (Test-Path -LiteralPath $sourceToolDir) {
            New-Item -ItemType Directory -Path $expectedToolDir -Force | Out-Null
            Copy-Item -Path (Join-Path $sourceToolDir '*') -Destination $expectedToolDir -Recurse -Force
            Write-Host "Copied matching WDK x64 host tools into target-referenced folder:"
            Write-Host "  From: $sourceToolDir"
            Write-Host "  To:   $expectedToolDir"
          } else {
            Write-Warning "Matching x64 host-tool directory not present: $sourceToolDir"
          }

          # InfVerif is loaded by the WDK target as x86\InfVerif.dll relative to its build tree.
          # Search the exact pinned-kit NuGet folders and mirror the DLL plus adjacent DLL dependencies.
          $searchRoots = @($packages, (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin')) |
            Where-Object { Test-Path -LiteralPath $_ }
          $dllMatches = Get-ChildItem -Path $searchRoots -Filter 'InfVerif.dll' -File -Recurse -ErrorAction SilentlyContinue
          $exactKit = $dllMatches | Where-Object { $_.FullName -match '10\.0\.28000\.0' } | Select-Object -First 1
          $expectedInfDir = Join-Path $arm64 'build\10.0.28000.0\x86'
          if ($exactKit) {
            New-Item -ItemType Directory -Path $expectedInfDir -Force | Out-Null
            Copy-Item -LiteralPath $exactKit.FullName -Destination (Join-Path $expectedInfDir 'InfVerif.dll') -Force
            Get-ChildItem -LiteralPath $exactKit.DirectoryName -File |
              Where-Object { $_.Extension -ieq '.dll' -and $_.Name -ne 'InfVerif.dll' } |
              Copy-Item -Destination $expectedInfDir -Force
            Write-Host "InfVerif helper source: $($exactKit.FullName)"
          } else {
            Write-Warning 'No InfVerif.dll found in the pinned 10.0.28000.0 tool trees; the compile artifact will still be preserved if linking succeeds.'
          }

          foreach ($path in @(
            (Join-Path $expectedToolDir 'ApiValidator.exe'),
            (Join-Path $expectedToolDir 'Aitstatic.exe'),
            (Join-Path $expectedToolDir 'Microsoft.Kits.Drivers.ApiValidator.dll'),
            (Join-Path $expectedInfDir 'InfVerif.dll')
          )) {
            Write-Host "$(Test-Path -LiteralPath $path): $path"
          }

      - name: Verify required upstream fixes and build ARM64 driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:UPSTREAM_DIR 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.c'
          $text = Get-Content -LiteralPath $source -Raw
          if ($text -notmatch 'InitializationData\.Cleanup\s*=\s*SdhcCleanup') {
            throw 'Pinned source is missing PR #25 cleanup callback fix.'
          }
          if ($text -notmatch 'InitializationData\.PowerControlCallback\s*=\s*SdhcPowerControlCallback') {
            throw 'Pinned source is missing PR #25 power-control callback fix.'
          }
          if ($text -notmatch '(?s)SDHC_INTERRUPT_ERROR_SIGNAL_ENABLE,\s*0\s*\);') {
            throw 'Pinned source is missing PR #26 early-interrupt fix.'
          }
          $sourceInf = Join-Path $env:UPSTREAM_DIR 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.inf'
          $infSourceText = Get-Content -LiteralPath $sourceInf -Raw
          if ($infSourceText -notmatch '(?im)^%ACPI\\ARASAN\.DeviceDesc%=SDHost,\s*ACPI\\BCM2847,\s*ACPI\\ARASAN\s*$') {
            throw 'Pinned INF must explicitly map ACPI\BCM2847 for the Pi 400 SDC1 device.'
          }

          $artifact = Join-Path $env:GITHUB_WORKSPACE '_sdhc_ci_artifact'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          $project = Join-Path $env:UPSTREAM_DIR 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.vcxproj'
          $solutionDir = (Join-Path $env:UPSTREAM_DIR 'build\bcm2836') + '\'
          $buildLog = Join-Path $artifact 'msbuild-arm64-release.log'
          $manifest = @(
            'Project: Raspberry Pi Arasan SDHC miniport (bcm2836sdhc)',
            "Upstream repository: $env:UPSTREAM_REPO",
            "Upstream commit: $env:UPSTREAM_COMMIT",
            'Configuration: Release',
            'Platform: ARM64',
            'Signing: Off (compile candidate only; not an installable package)',
            'Required-fix checks: PR #25 cleanup/power callbacks; PR #26 early interrupt masking; INF ACPI\BCM2847 mapping'
          )
          Set-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt') -Value $manifest -Encoding utf8
          Copy-Item -LiteralPath $source -Destination (Join-Path $artifact 'bcm2836sdhc.c')

          & $env:MSBUILD_PATH $project '/t:Build' '/p:Configuration=Release' '/p:Platform=ARM64' "/p:SolutionDir=$solutionDir" '/p:SignMode=Off' '/p:EnableInf2cat=false' '/m' '/v:normal' "/flp:logfile=$buildLog;verbosity=normal"
          $exitCode = $LASTEXITCODE
          $outRoot = Join-Path $env:UPSTREAM_DIR 'build\bcm2836\ARM64\Release\Output'
          $sys = Get-ChildItem -LiteralPath $outRoot -Filter 'bcm2836sdhc.sys' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $linkSucceeded = $false
          if (Test-Path -LiteralPath $buildLog) {
            $linkSucceeded = Select-String -LiteralPath $buildLog -Pattern 'bcm2836sdhc\.vcxproj -> .*bcm2836sdhc\.sys' -Quiet
          }

          if (-not $sys) {
            "MSBuild exit code: $exitCode" | Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
            if (Test-Path -LiteralPath $buildLog) {
              Get-Content -LiteralPath $buildLog -Tail 120 |
                Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
            }
            throw "No bcm2836sdhc.sys output was produced. MSBuild exit code: $exitCode"
          }

          Copy-Item -LiteralPath $sys.FullName -Destination (Join-Path $artifact 'bcm2836sdhc.sys')
          $stampedInf = Join-Path $outRoot 'bcm2836sdhc.inf'
          if (Test-Path -LiteralPath $stampedInf) {
            Copy-Item -LiteralPath $stampedInf -Destination (Join-Path $artifact 'bcm2836sdhc.inf')
          } else {
            Copy-Item -LiteralPath (Join-Path $env:UPSTREAM_DIR 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.inf') -Destination (Join-Path $artifact 'bcm2836sdhc.inf')
          }

          "Output binary: $($sys.FullName)" | Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          "Linker success marker in MSBuild log: $linkSucceeded" | Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          "Overall MSBuild exit code: $exitCode" | Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          "Artifact type: unsigned compile candidate only; no catalog/signature included; not install-ready." |
            Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')

          Get-FileHash -Algorithm SHA256 (Join-Path $artifact 'bcm2836sdhc.sys') |
            Format-List | Out-String | Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')

          if ($exitCode -ne 0) {
            $tail = if (Test-Path -LiteralPath $buildLog) { Get-Content -LiteralPath $buildLog -Tail 200 } else { @() }
            $validationOnly = ($tail -match 'INF verification exception') -and ($tail -match 'ApiValidator|MSB3721')
            if ($linkSucceeded -and $validationOnly) {
              @(
                'RESULT: C/C++ compile and link produced bcm2836sdhc.sys.'
                'QUALIFICATION: WDK post-build validators failed in the current NuGet layout (InfVerif.dll load failure and ApiValidator tool/dependency failure).'
                'This artifact is useful only for compile/source inspection and is NOT a validated or installable driver package.'
              ) | Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
              Write-Warning 'Compiler/linker produced a candidate, but post-build validation failed; details are retained in the manifest and log.'
            } else {
              throw "MSBuild exited $exitCode and the failure was not safely classifiable as post-build validation only. See msbuild log."
            }
          } else {
            'RESULT: MSBuild completed successfully.' |
              Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          }

      - name: Independently validate INF and create test-signed ARM64 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:GITHUB_WORKSPACE '_sdhc_ci_artifact'
          $package = Join-Path $artifact 'rpi400-sdhc-test-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          $sys = Join-Path $artifact 'bcm2836sdhc.sys'
          $inf = Join-Path $artifact 'bcm2836sdhc.inf'
          if (-not (Test-Path -LiteralPath $sys) -or -not (Test-Path -LiteralPath $inf)) {
            throw "Compile candidate .sys/.inf missing; not creating a package."
          }
          Copy-Item -LiteralPath $sys -Destination $package
          Copy-Item -LiteralPath $inf -Destination $package
          $packageInfText = Get-Content -LiteralPath (Join-Path $package 'bcm2836sdhc.inf') -Raw
          if ($packageInfText -notmatch '(?im)^%ACPI\\ARASAN\.DeviceDesc%=SDHost,\s*ACPI\\BCM2847,\s*ACPI\\ARASAN\s*$') {
            throw 'Package INF missing explicit ACPI\BCM2847 model mapping; refusing to sign.'
          }

          # Step 7 already exposed WDK tool directories through GITHUB_PATH. Resolve just
          # the required tools here instead of recursively scanning entire package trees again.
          $toolDirectories = @($env:PATH -split ';' | ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Container) } |
            Select-Object -Unique)

          function Find-Tool([string]$Name) {
            $toolCandidates = @(
              foreach ($dir in $toolDirectories) {
                $candidate = Join-Path $dir $Name
                if (Test-Path -LiteralPath $candidate -PathType Leaf) { Get-Item -LiteralPath $candidate }
              }
            )
            if (-not $toolCandidates.Count) {
              throw "Required WDK tool not found on PATH: $Name. Step 7 should have exposed its directory."
            }
            $pinned = $toolCandidates | Where-Object { $_.FullName -match '10\.0\.28000\.0' -and $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if (-not $pinned) { $pinned = $toolCandidates | Where-Object { $_.FullName -match '10\.0\.28000\.0' } | Select-Object -First 1 }
            if (-not $pinned) { $pinned = $toolCandidates | Select-Object -First 1 }
            Write-Host "Resolved $Name -> $($pinned.FullName)"
            return $pinned.FullName
          }

          function Invoke-LoggedTool {
            param(
              [Parameter(Mandatory=$true)][string]$Label,
              [Parameter(Mandatory=$true)][string]$ToolPath,
              [Parameter(Mandatory=$true)][string[]]$Arguments,
              [Parameter(Mandatory=$true)][string]$LogPath,
              [int]$TimeoutSeconds = 120
            )
            Write-Host ("START: {0} (timeout {1}s)" -f $Label, $TimeoutSeconds)
            Write-Host "Executable: $ToolPath"
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $ToolPath
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            foreach ($arg in $Arguments) { [void]$psi.ArgumentList.Add($arg) }

            $proc = [System.Diagnostics.Process]::new()
            $proc.StartInfo = $psi
            if (-not $proc.Start()) { throw "Could not start $Label." }
            $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
            $stderrTask = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit($TimeoutSeconds * 1000)) {
              try { $proc.Kill($true) } catch {}
              try { $proc.WaitForExit(5000) | Out-Null } catch {}
              throw "$Label exceeded $TimeoutSeconds seconds and was terminated. Inspect $LogPath."
            }
            $proc.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            $logText = @("Label: $Label", "Executable: $ToolPath", "Exit code: $($proc.ExitCode)", '', $stdout, $stderr) -join [Environment]::NewLine
            [System.IO.File]::WriteAllText($LogPath, $logText, [System.Text.UTF8Encoding]::new($false))
            if ($stdout) { Write-Host $stdout }
            if ($stderr) { Write-Host $stderr }
            Write-Host "END: $Label (exit $($proc.ExitCode))"
            return [int]$proc.ExitCode
          }

          $infverif = Find-Tool 'infverif.exe'
          $inf2cat = Find-Tool 'inf2cat.exe'
          $signtool = Find-Tool 'signtool.exe'

          # The WDK MSBuild target logs a DLL-loading exception for its bundled InfVerif task.
          # Run the supported command-line validator explicitly against the stamped package INF.
          $infLog = Join-Path $artifact 'infverif-standalone.log'
          $infExit = Invoke-LoggedTool -Label 'Standalone InfVerif /u /v' -ToolPath $infverif -Arguments @('/u', '/v', (Join-Path $package 'bcm2836sdhc.inf')) -LogPath $infLog -TimeoutSeconds 180
          "InfVerif command: $infverif /u /v bcm2836sdhc.inf" |
            Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          "InfVerif exit code: $infExit" |
            Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          if ($infExit -ne 0) {
            throw "Standalone InfVerif failed (exit $infExit); see infverif-standalone.log. Package will remain unsigned."
          }

          # Sign the driver image first; Inf2Cat then hashes the final driver and INF.
          $subject = "CN=Rpi_Testing SDHC Test Signing CI $env:GITHUB_RUN_ID"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(1)

          $pfx = Join-Path $env:RUNNER_TEMP 'rpi400-sdhc-test-signing.pfx'
          $passwordText = [guid]::NewGuid().ToString('N') + [guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          $cer = Join-Path $package 'rpi400-sdhc-test.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null

          try {
            $driverSignLog = Join-Path $artifact 'signtool-driver.log'
            $signExit = Invoke-LoggedTool -Label 'Sign driver image' -ToolPath $signtool -Arguments @('sign', '/v', '/fd', 'SHA256', '/f', $pfx, '/p', $passwordText, (Join-Path $package 'bcm2836sdhc.sys')) -LogPath $driverSignLog -TimeoutSeconds 90
            if ($signExit -ne 0) { throw "SignTool failed signing bcm2836sdhc.sys (exit $signExit); see $driverSignLog." }

            $inf2catLog = Join-Path $artifact 'inf2cat.log'
            $catExit = Invoke-LoggedTool -Label 'Inf2Cat /os:10_NI_ARM64' -ToolPath $inf2cat -Arguments @("/driver:$package", '/os:10_NI_ARM64', '/verbose') -LogPath $inf2catLog -TimeoutSeconds 180
            if ($catExit -ne 0) { throw "Inf2Cat failed for Windows 11 22H2 ARM64 (exit $catExit); see $inf2catLog." }

            $cat = Join-Path $package 'bcm2836sdhc.cat'
            if (-not (Test-Path -LiteralPath $cat)) { throw "Inf2Cat returned success but catalog file not found: $cat" }

            $catSignLog = Join-Path $artifact 'signtool-catalog.log'
            $signCatExit = Invoke-LoggedTool -Label 'Sign catalog' -ToolPath $signtool -Arguments @('sign', '/v', '/fd', 'SHA256', '/f', $pfx, '/p', $passwordText, $cat) -LogPath $catSignLog -TimeoutSeconds 90
            if ($signCatExit -ne 0) { throw "SignTool failed signing catalog (exit $signCatExit); see $catSignLog." }

            Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
            Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null

            $verifyDriverLog = Join-Path $artifact 'signtool-verify-driver.log'
            $verifyDriverExit = Invoke-LoggedTool -Label 'Verify embedded driver signature' -ToolPath $signtool -Arguments @('verify', '/v', '/pa', (Join-Path $package 'bcm2836sdhc.sys')) -LogPath $verifyDriverLog -TimeoutSeconds 90
            if ($verifyDriverExit -ne 0) { throw "Embedded driver signature verification failed; see $verifyDriverLog." }
            $verifyCatLog = Join-Path $artifact 'signtool-verify-catalog.log'
            $verifyCatExit = Invoke-LoggedTool -Label 'Verify signed catalog and INF' -ToolPath $signtool -Arguments @('verify', '/v', '/pa', '/c', $cat, (Join-Path $package 'bcm2836sdhc.inf')) -LogPath $verifyCatLog -TimeoutSeconds 90
            if ($verifyCatExit -ne 0) { throw "Catalog signature/package verification failed; see $verifyCatLog." }

            @'
          TEST-SIGNED EXPERIMENTAL DRIVER PACKAGE — NOT A PRODUCTION/RELEASE DRIVER

          Hardware/OS target: Raspberry Pi 400, Windows 11 ARM64 (build 22621), ACPI\BCM2847 SDC1.
          Source: raspberrypi/windows-drivers commit 31c2c748e6358711cd72467b7ad52da08691e54b.
          Contains the upstream cleanup-callback and early-interrupt fixes.
          This package is not yet validated on physical Pi 400 hardware. Successful installation does not guarantee SDIO child enumeration or CYW43455 Wi-Fi; a separate Windows WLAN function driver is still required.

          Signing: per-run self-signed test certificate. Only the public .cer is included; the temporary private key is not included.
          Windows requires appropriate test-signing configuration and trust of this certificate before loading a test-signed kernel driver. Secure Boot may block TESTSIGNING changes; prepare recovery/BitLocker access before making any boot-security changes.

          Caution: this is an SD host-controller miniport. A defective host driver can hang/crash the system or affect SDC1. Do not install on a primary/productive system. Preserve a recovery path and inspect the included INF/build logs first.
          '@ | Set-Content -LiteralPath (Join-Path $package 'README-TEST-INSTALL.txt') -Encoding UTF8

            'Standalone InfVerif: PASS (/u /v).' |
              Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
            'Inf2Cat: PASS (/os:10_NI_ARM64).' |
              Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
            'Test signing: PASS (ephemeral CI code-signing certificate; private key excluded).' |
              Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
            Get-FileHash -Algorithm SHA256 (Join-Path $package 'bcm2836sdhc.sys'),
              (Join-Path $package 'bcm2836sdhc.inf'),
              (Join-Path $package 'bcm2836sdhc.cat'),
              $cer |
              Format-Table -AutoSize | Out-String |
              Add-Content -LiteralPath (Join-Path $artifact 'BUILD-MANIFEST.txt')
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }

