name: Build Raspberry Pi 400 Arasan SDHC reference driver (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-rpi400-sdhc-arm64.yml

permissions:
  contents: read

jobs:
  build-bcm2836sdhc:
    name: Build bcm2836sdhc for ARM64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned Raspberry Pi Windows driver source
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/windows-drivers
          ref: 88ee238c9debecce810d208cac1e5f36add3d2a1
          path: external/windows-drivers

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Inspect MSBuild and Windows Driver Kit setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          $msbuild = Get-Command msbuild.exe -ErrorAction Stop
          Write-Host "MSBuild: $($msbuild.Source)"
          $programFilesX86 = (Get-Item 'Env:ProgramFiles(x86)').Value
          $wdkBuild = Join-Path $programFilesX86 'Windows Kits\10\build'
          if (-not (Test-Path $wdkBuild)) {
            throw "Windows Kits build folder not found: $wdkBuild"
          }
          Write-Host "Windows Kits build root: $wdkBuild"
          Get-ChildItem -Path $wdkBuild -Directory | Select-Object FullName | Format-Table -AutoSize
          $wdkFiles = Get-ChildItem -Path $wdkBuild -Filter '*.props' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 30 -ExpandProperty FullName
          if ($wdkFiles) { $wdkFiles | ForEach-Object { Write-Host "WDK props: $_" } }
          else { Write-Warning 'No .props files found under the Windows Kits build root; MSBuild will provide the authoritative project/toolset error if integration is missing.' }
          $vsWhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vsWhere) {
            $vsPath = & $vsWhere -products '*' -latest -property installationPath
            Write-Host "Visual Studio: $vsPath"
            if ($vsPath -and (Test-Path (Join-Path $vsPath 'MSBuild\Microsoft\VC'))) {
              Get-ChildItem -Path (Join-Path $vsPath 'MSBuild\Microsoft\VC') -Filter '*Driver*.props' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty FullName | ForEach-Object { Write-Host "VS driver props: $_" }
            }
          }
          Write-Host 'Pinned upstream commit: 88ee238c9debecce810d208cac1e5f36add3d2a1'

      - name: Build upstream Arasan SDHC driver for ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs, artifacts\RPi400-BCM2836SDHC-ARM64 | Out-Null
          $sourceRoot = (Resolve-Path 'external\windows-drivers').Path
          $solutionDir = (Resolve-Path (Join-Path $sourceRoot 'build\bcm2836')).Path.TrimEnd('\') + '\'
          $project = Join-Path $sourceRoot 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.vcxproj'
          if (-not (Test-Path $project)) { throw "Source project not found: $project" }
          $arguments = @(
            $project,
            '/m',
            '/nologo',
            '/verbosity:minimal',
            '/p:Configuration=Release',
            '/p:Platform=ARM64',
            "/p:SolutionDir=$solutionDir",
            '/p:SignMode=Off',
            '/p:EnableInf2cat=false'
          )
          & msbuild.exe @arguments 2>&1 | Tee-Object -FilePath 'build-logs\bcm2836sdhc-msbuild.log'
          $buildExitCode = $LASTEXITCODE

          $outputDir = Join-Path $solutionDir 'ARM64\Release\Output'
          $driver = Get-ChildItem -Path $sourceRoot -Filter 'bcm2836sdhc.sys' -Recurse -File |
            Where-Object { $_.FullName -match '\\ARM64\\Release\\Output\\' } |
            Select-Object -First 1
          if (-not $driver) {
            Get-ChildItem -Path $sourceRoot -Filter 'bcm2836sdhc.sys' -Recurse -File | Select-Object FullName,Length
            throw "MSBuild completed but bcm2836sdhc.sys was not found under the expected Release/ARM64 output. Expected directory: $outputDir"
          }

          $packageDir = 'artifacts\RPi400-BCM2836SDHC-ARM64'
          Copy-Item -LiteralPath $driver.FullName -Destination (Join-Path $packageDir 'bcm2836sdhc.sys') -Force
          Copy-Item -LiteralPath (Join-Path $sourceRoot 'drivers\sd\bcm2836\bcm2836sdhc\bcm2836sdhc.inf') -Destination (Join-Path $packageDir 'bcm2836sdhc.inf') -Force
          $cat = Get-ChildItem -Path (Split-Path $driver.FullName) -Filter 'bcm2836sdhc.cat' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cat) { Copy-Item -LiteralPath $cat.FullName -Destination (Join-Path $packageDir 'bcm2836sdhc.cat') -Force }
          @"
          Project: raspberrypi/windows-drivers/drivers/sd/bcm2836/bcm2836sdhc
          Source commit: 88ee238c9debecce810d208cac1e5f36add3d2a1
          Target architecture: ARM64
          Configuration: Release
          MSBuild exit code: $buildExitCode
          Output file: $($driver.FullName)
          Build runner: $env:ImageOS $env:ImageVersion
          Catalog copied: $([bool]$cat)

          IMPORTANT: reference build only. Do not install this package yet. Review build logs, target OS compatibility, resources and signing/catalog state first. A produced SYS file is not hardware validation.
          "@ | Set-Content -LiteralPath (Join-Path $packageDir 'BUILD-MANIFEST.txt') -Encoding UTF8
          Get-ChildItem -Path $packageDir -File | Select-Object Name,Length | Format-Table -AutoSize
          if ($buildExitCode -ne 0) { throw "MSBuild returned $buildExitCode. Output preserved for inspection; do not install." }

      - name: Upload ARM64 reference build and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpi400-bcm2836sdhc-arm64-reference
          path: |
            artifacts/RPi400-BCM2836SDHC-ARM64/**
            build-logs/**
          if-no-files-found: warn
          retention-days: 14
